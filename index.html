<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Grove Portal - Login</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #e8f5e9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #2d3748;
        }

        .login-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .brand-logo {
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .brand-logo img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #2e7d32;
            box-shadow: 0 3px 10px rgba(46, 125, 50, 0.2);
        }

        .brand-logo .brand-netra {
            font-size: 28px;
            font-weight: 700;
            color: #1a365d;
            font-family: Georgia, serif;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #3182ce;
        }

        .login-btn {
            width: 100%;
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .login-btn:hover {
            background-color: #1b5e20;
        }

        .error-message {
            color: #e53e3e;
            font-size: 13px;
            margin-top: 14px;
            font-weight: 600;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-logo">
            <img src="image_4.png" alt="Green Grove Logo">
            <div class="brand-netra">Green Grove Portal</div>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="userId">Admission No / Staff ID / Admin ID</label>
                <input type="text" id="userId" placeholder="Enter User ID" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter Password" required>
            </div>

            <button type="submit" class="login-btn">Login</button>
            <div id="errorMsg" class="error-message">User ID not found!</div>
        </form>
    </div>

    <script>
        // Supabase Initialization with your new Publishable Key
        const SUPABASE_URL = 'https://fpfhyuhccccuxzzigmri.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_yfXyAFN8X0YhS0F9PsMADg_ecfkWtGt';
        const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function handleLogin(e) {
            e.preventDefault();
            const idInput = document.getElementById('userId').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            errorMsg.style.display = 'none';

            try {
                const { data, error } = await dbClient
                    .from('users')
                    .select('*')
                    .eq('id', idInput)
                    .single();

                if (error || !data) {
                    errorMsg.innerText = 'User ID not found!';
                    errorMsg.style.display = 'block';
                    return;
                }

                if (data.password !== passwordInput) {
                    errorMsg.innerText = 'Incorrect password!';
                    errorMsg.style.display = 'block';
                    return;
                }

                // Dynamic Redirect based on role
                if (data.role === 'admin') {
                    window.location.href = 'admin_dashboard.html';
                } else if (data.role === 'teacher') {
                    window.location.href = 'teacher_dashboard.html';
                } else {
                    window.location.href = 'student_dashboard.html';
                }
            } catch (err) {
                errorMsg.innerText = 'Error connecting to database';
                errorMsg.style.display = 'block';
            }
        }
    </script>
</body>
</html>
